name: USPS Tracker

# 触发方式：
#  - workflow_dispatch：手动触发，也是“链式心跳”自触发用的入口
#  - schedule：仅作备用唤醒（GitHub 定时不可靠，主要靠下面的心跳维持）
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

# 并发互斥：同一时刻只允许一个 workflow run，下一轮排队等当前轮结束再开始，
# 杜绝两轮重叠导致并发超出账号上限。
concurrency:
  group: usps-tracker
  cancel-in-progress: false

# 用内置 GITHUB_TOKEN 触发下一轮 / 删除历史 run，需要 actions: write 权限。
# 这样无需维护会过期的 PAT，避免 relay 报 HTTP 401 Bad credentials。
permissions:
  actions: write
  contents: read

jobs:
  # 心跳哨兵：单个轻量 job，循环探测库存。
  #   - 有货 / 检测异常（网络抖动）-> 放行，启动干活实例
  #   - 确认没货（200 且 =0）       -> 原地每 60 秒轮询，只占这 1 个 job，
  #                                    一旦来货立刻放行；轮询满约 10 分钟则交给下一轮接力继续守。
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      work: ${{ steps.poll.outputs.work }}
      matrix: ${{ steps.poll.outputs.matrix }}
    steps:
      - name: 探测库存（心跳轮询）
        id: poll
        run: |
          # mysql 探测：重试 3 次，返回 GO（有货：200 且 >0）/ NO（没货或网络错误）
          # 注意：mysql 网络错误一律算“没有”，不分配 mysql 实例。
          check_mysql_once() {
            for i in 1 2 3; do
              code=$(curl -s -4 -o mbody.txt -w "%{http_code}" \
                --connect-timeout 10 --max-time 25 \
                --retry 3 --retry-delay 2 --retry-connrefused --retry-all-errors \
                "http://mysql_frp.kungfu.bj.cn:8082/get_mysql_check_num" || echo "000")
              body=$(cat mbody.txt 2>/dev/null | tr -dc '0-9')
              echo "  mysql try $i: http=$code body=$body" 1>&2
              if [ "$code" = "200" ] && [ -n "$body" ]; then
                if [ "$body" -gt 0 ] 2>/dev/null; then echo "GO"; return; else echo "NO"; return; fi
              fi
              sleep 3
            done
            echo "NO"
          }

          # big 单次探测：重试 3 次，返回 GO（有货）/ EMPTY（确认没货）/ UNKNOWN（检测失败）
          check_once() {
            for i in 1 2 3; do
              code=$(curl -s -4 -o body.txt -w "%{http_code}" \
                --connect-timeout 10 --max-time 25 \
                --retry 3 --retry-delay 2 --retry-connrefused --retry-all-errors \
                "http://kungfu.bj.cn:8082/get_big_check_num" || echo "000")
              body=$(cat body.txt 2>/dev/null | tr -dc '0-9')
              echo "  try $i: http=$code body=$body" 1>&2
              if [ "$code" = "200" ] && [ -n "$body" ]; then
                if [ "$body" -gt 0 ] 2>/dev/null; then echo "GO"; return; else echo "EMPTY"; return; fi
              fi
              sleep 3
            done
            echo "UNKNOWN"
          }

          # 生成 matrix（19 个实例分配）：
          #   - mysql 有货：固定 9 个跑 big + 10 个跑 mysql
          #   - mysql 没货：19 个全部跑 big
          build_matrix() {
            local mysql_go="$1"
            local items=""
            if [ "$mysql_go" = "yes" ]; then
              for i in $(seq 1 9); do items="$items{\"id\":\"big-$i\",\"num_type\":\"big\"},"; done
              for i in $(seq 1 10); do items="$items{\"id\":\"mysql-$i\",\"num_type\":\"mysql\"},"; done
            else
              for i in $(seq 1 19); do items="$items{\"id\":\"big-$i\",\"num_type\":\"big\"},"; done
            fi
            items="${items%,}"
            echo "{\"include\":[$items]}"
          }

          # 最多轮询约 10 分钟（10 次，每次间隔 60s）。
          for round in $(seq 1 10); do
            m=$(check_mysql_once)
            r=$(check_once)
            echo "poll round $round => mysql:$m big:$r"

            big_go="no"; mysql_go="no"
            if [ "$r" = "GO" ] || [ "$r" = "UNKNOWN" ]; then big_go="yes"; fi
            if [ "$m" = "GO" ]; then mysql_go="yes"; fi

            # 只要 big 或 mysql 任一有活就放行
            if [ "$big_go" = "yes" ] || [ "$mysql_go" = "yes" ]; then
              matrix=$(build_matrix "$mysql_go")
              echo "work=true" >> "$GITHUB_OUTPUT"
              echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
              echo "最终分配 matrix: $matrix" 1>&2
              exit 0
            fi
            # 都没货：原地等 60 秒再探（心跳）
            sleep 60
          done
          # 轮询期满仍确认没货 -> 本轮不干活（由下一轮接力继续守）
          echo "work=false" >> "$GITHUB_OUTPUT"
          echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"

  # 干活：仅当 check 放行（work=true）才启动这些实例
  # matrix 由 check 动态生成：mysql 有货=9 big+10 mysql；mysql 没货=19 big
  run:
    needs: check
    if: ${{ needs.check.outputs.work == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # 最多 19 个实例 + 1 个 relay = 20，正好占满账号并发上限（check 此时已结束，不占名额）。
      max-parallel: 19
      fail-fast: false
      matrix: ${{ fromJson(needs.check.outputs.matrix) }}
    env:
      USPS_CLIENT_ID: ${{ secrets.USPS_CLIENT_ID }}
      USPS_CLIENT_SECRET: ${{ secrets.USPS_CLIENT_SECRET }}
      NUM_TYPE: ${{ matrix.num_type }}
      WORKERS: "1"
      USE_PROXY: "false"
      RUN_SECONDS: "60"
      RUST_LOG: info
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 运行预编译二进制
        # 二进制为 x86_64-unknown-linux-musl 静态链接，无外部依赖
        # 固定运行 60 秒（RUN_SECONDS）后优雅退出
        run: |
          chmod +x ./bin/usps-tracker-rs
          ./bin/usps-tracker-rs

  # mysql 常驻备份：不做任何检测、不依赖 check，每轮固定占用一个任务直接跑 mysql。
  # 无论有没有单号都运行（没单号时空转满 RUN_SECONDS 后优雅退出），保证 mysql 始终有覆盖。
  run_mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      USPS_CLIENT_ID: ${{ secrets.USPS_CLIENT_ID }}
      USPS_CLIENT_SECRET: ${{ secrets.USPS_CLIENT_SECRET }}
      NUM_TYPE: mysql
      WORKERS: "1"
      USE_PROXY: "false"
      RUN_SECONDS: "60"
      RUST_LOG: info
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 运行预编译二进制
        run: |
          chmod +x ./bin/usps-tracker-rs
          ./bin/usps-tracker-rs

  # 接力 + 清理：无论本轮有没有货都再触发下一轮，保持心跳永不熄火
  # if: always()  —— 关键。check 在库存长时间为空/服务器不可达时会撞上
  # 自身的 timeout-minutes 被强制取消；默认规则下 needs: check 会导致 relay 被跳过，
  # 于是下一轮永远不会被触发，整条心跳链就此断掉（表现为“不再自动运行”）。
  # 用 always() 让 relay 无视 check 的成败/超时，始终触发下一轮，保证心跳不熄火。
  relay:
    needs: check
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 触发下一轮（保持心跳）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 有 concurrency 互斥兜底，立即触发下一轮即可（会排队等本轮结束）。
          gh workflow run "USPS Tracker" --ref "${{ github.ref_name }}"

      - name: 清理已完成的历史 run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          ids=$(gh api "repos/$REPO/actions/runs?status=completed&per_page=100" \
            --jq '.workflow_runs[].id')
          for id in $ids; do
            if [ "$id" != "$CURRENT_RUN_ID" ]; then
              gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null 2>&1 || true
            fi
          done
          echo "cleanup done"
